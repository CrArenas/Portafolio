<!--
  Fuente de public/og.png (imagen de vista previa al compartir, 1200×630).
  Para regenerarla: abre este archivo en Chrome, DevTools → modo dispositivo
  a 1200×630 → menú ⋮ → "Capture screenshot", y guarda como public/og.png.
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: radial-gradient(ellipse at 75% 40%, #18213A 0%, #0F1320 55%, #0A0D16 100%);
    color: #E7EAF0; font-family: 'Inter', sans-serif;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(122,178,238,0.5) 1.4px, transparent 1.6px),
                      radial-gradient(circle, rgba(229,181,103,0.45) 1.2px, transparent 1.4px);
    background-size: 28px 28px, 56px 56px;
    background-position: 0 0, 14px 14px;
    mask-image: linear-gradient(100deg, transparent 38%, black 80%);
  }
  .frame { position: absolute; inset: 28px; border: 1px solid rgba(148,163,184,0.18); border-radius: 18px; }
  .content { position: absolute; left: 84px; top: 128px; right: 84px; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 20px; letter-spacing: 0.12em; color: #7AB2EE; text-transform: uppercase; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 88px; line-height: 1.02; letter-spacing: -0.03em; color: #E7EAF0; margin-top: 24px; } h1 span { color: #E5B567; }
  .line { width: 120px; height: 3px; border-radius: 3px; margin: 34px 0 28px; background: #E5B567; }
  .role { font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 600; color: #E7EAF0; }
  .role span { color: #E5B567; }
  .tags { display: flex; gap: 12px; margin-top: 30px; }
  .tag { font-family: 'JetBrains Mono', monospace; font-size: 17px; padding: 8px 16px; color: #E5B567; background: rgba(229,181,103,0.12); border-radius: 999px; }
  .url { position: absolute; right: 84px; bottom: 64px; font-family: 'JetBrains Mono', monospace; font-size: 18px; color: #7C879B; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="frame"></div>
  <div class="content">
    <div class="eyebrow">Portfolio · Portafolio</div>
    <h1>Cristian Andrés<br>Arenas Vargas<span>.</span></h1>
    <div class="line"></div>
    <div class="role">Software Developer <span>·</span> 3D &amp; XR</div>
    <div class="tags">
      <span class="tag">Laravel</span><span class="tag">React</span><span class="tag">React Native</span><span class="tag">Unity</span><span class="tag">Three.js</span>
    </div>
  </div>
  <div class="url">portfolio-3d-ca.vercel.app</div>
</body>
</html>
